{% extends "base.html" %}
{% block content %}
<h1>Registered Students</h1>
<table>
<tr><th>ID</th><th>Name</th><th>Roll</th><th>Card ID</th><th>Face</th><th></th></tr>
{% for s in students %}
<tr>
  <td>{{ s['id'] }}</td><td>{{ s['name'] }}</td><td>{{ s['roll_no'] }}</td>
  <td><code>{{ s['card_id'] }}</code></td>
  <td>{% if s['face_image'] %}<img src="{{ url_for('static', filename='faces/'+s['face_image']) }}" width="60" style="border-radius:6px">{% else %}-{% endif %}</td>
  <td><form method="POST" action="/student/delete/{{ s['id'] }}" onsubmit="return confirm('Delete?')"><button class="btn danger">Delete</button></form></td>
</tr>
{% else %}
<tr><td colspan="6">No students. <a href="/register">Register one</a>.</td></tr>
{% endfor %}
</table>
{% endblock %}
